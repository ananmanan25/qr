<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WELCOME: ANANMANAN</title>
    <meta name="description" content="Shop ANANMANAN for the latest in futuristic wear. Explore our innovative collection of tech-inspired clothing.">

    <link rel="icon" type="image/png" href="https://ananmanan.store/i/an.png" sizes="32x32">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500&family=Orbitron:wght@400;900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --accent: #00ff0d; /* Neon Green */
            --dark-bg: #050505;
            --glass: rgba(10, 10, 10, 0.85);
            --border: rgba(9, 255, 0, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--dark-bg);
            color: white;
            font-family: 'JetBrains Mono', monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- DYNAMIC MESH BACKGROUND --- */
        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, #1a1a1a 0%, #050505 50%),
                        radial-gradient(circle at 80% 70%, #0d220e 0%, #050505 50%);
            z-index: -1;
        }

        /* --- TERMINAL LOADER --- */
        #loader {
            position: fixed; inset: 0; background: #000;
            display: flex; flex-direction: column; justify-content: center;
            padding: 40px; z-index: 9999;
            transition: transform 1s cubic-bezier(0.85, 0, 0.15, 1);
            text-align: center;
        }

        .term-line { color: var(--accent); font-size: 0.7rem; margin-bottom: 5px; opacity: 0; text-transform: uppercase; letter-spacing: 2px;}

        /* --- MAIN CARD --- */
        .container { width: 95%; max-width: 420px; z-index: 10; padding: 20px 0; }

        .brand-card {
            background: var(--glass);
            backdrop-filter: blur(30px);
            padding: 35px 20px;
            border-radius: 40px;
            border: 1px solid var(--border);
            text-align: center;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        .brand-name { font-family: 'Syncopate'; font-size: 1.6rem; letter-spacing: 10px; margin-bottom: 5px; font-weight: 700; }
        .sub-tag { font-family: 'Orbitron'; font-size: 0.55rem; color: var(--accent); letter-spacing: 4px; margin-bottom: 30px; }

        /* --- PRODUCT SLIDER --- */
        .slider-container {
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-radius: 25px;
            margin-bottom: 25px;
            position: relative;
            border: 1px solid rgba(255,255,255,0.05);
            background: #111;
        }

      .slider-track {
            display: flex;
            height: 100%;
            width: auto; /* Change from 100% to auto */
            transition: transform 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }
       .slide {
            min-width: 100%; /* Forces each slide to take full width */
            flex-shrink: 0;   /* Prevents the slide from shrinking */
            height: 100%;
            position: relative;
        }

   .slide img { 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    filter: brightness(0.8);
    background-color: #111; /* This hides the white 'broken' icon box */
}
        .slide-label {
            position: absolute; bottom: 15px; left: 15px;
            font-size: 0.6rem; background: rgba(0,0,0,0.8);
            padding: 6px 12px; border-radius: 10px; border: 1px solid var(--accent);
            color: var(--accent); font-family: 'Orbitron';
        }

        /* --- LINKS --- */
        .link-stack { display: flex; flex-direction: column; gap: 12px; }

        .link-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 16px; border-radius: 18px;
            text-decoration: none; color: white;
            display: flex; align-items: center; justify-content: space-between;
            transition: 0.3s; font-size: 0.75rem; letter-spacing: 1px;
        }

        .link-item:hover {
            background: rgba(0, 255, 13, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .cta-btn { background: var(--accent); color: black; font-weight: 900; }
        .cta-btn i { color: black; }

        footer { margin-top: 25px; font-size: 0.6rem; opacity: 0.4; text-align: center; line-height: 1.5; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <div id="loader">
        <div class="term-line">> INITIALIZING_ANANMANAN_OS...</div>
        <div class="term-line">> FETCHING_REMOTE_ASSETS...</div>
        <div class="term-line">> CALIBRATING_VIBE...</div>
        <div class="term-line">> SYSTEM_READY.</div>
    </div>

    <div class="container">
        <div class="brand-card">
            <img src="https://ananmanan.store/i/an.png" style="width: 60px; margin-bottom: 20px;">
            <h1 class="brand-name">ANANMANAN</h1>
            <p class="sub-tag">FUTURISTIC WEAR</p>

            <div class="slider-container">
                <div class="slider-track" id="track">
                    <div class="slide"><div class="slide-label">SYNCING...</div></div>
                </div>
            </div>

            <div class="link-stack">
                <a href="https://ananmanan.store" class="link-item cta-btn">
                    <span>SHOP NEW ARRIVALS</span>
                    <i class="fas fa-bolt"></i>
                </a>
                <a href="https://www.instagram.com/wear.ananmanan" class="link-item">
                    <span>Follow Instagram</span>
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.facebook.com/ananmanan327/" class="link-item">
                    <span>Follow Facebook</span>
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.tiktok.com/@wear.ananmanan" class="link-item">
                    <span>Follow TikTok</span>
                    <i class="fab fa-tiktok"></i>
                </a>
                <a href="https://wa.me/94719478895" class="link-item">
                    <span>WhatsApp Order</span>
                    <i class="fab fa-whatsapp"></i>
                </a>
            </div>
        </div>

        <footer>
            ADVENTURE STARTS HERE<br>
            &copy; 2026 ANANMANAN STORE. ALL RIGHTS RESERVED.
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // 1. REPLACE THIS WITH YOUR ACTUAL CONFIG FROM FIREBASE CONSOLE
        const firebaseConfig = {
        apiKey: "AIzaSyCYLMXUCC6t-zT4CeFHBG7OMMwUNDhA8i0",
        authDomain: "ananmanan-2412c.firebaseapp.com",
        projectId: "ananmanan-2412c",
        storageBucket: "ananmanan-2412c.firebasestorage.app",
        messagingSenderId: "244268274543",
        appId: "1:244268274543:web:10d1e2ccb230d660d8ce9a",
    };


        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchProducts() {
            const track = document.getElementById('track');
            try {
                const querySnapshot = await getDocs(collection(db, "featured_products"));
                if (querySnapshot.empty) {
                    console.log("No products found in Firestore.");
                    return;
                }

                track.innerHTML = ""; // Clear loader placeholder
                let count = 0;

                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    const slide = document.createElement('div');
                    slide.className = 'slide';
                    slide.innerHTML = `
                        <img src="${data.imageUrl}" alt="Product">
                        <div class="slide-label">${data.label}</div>
                    `;
                    track.appendChild(slide);
                    count++;
                });

                startSlider(count);
            } catch (error) {
                console.error("Error fetching Firestore data: ", error);
            }
        }

        function startSlider(itemCount) {
            const track = document.getElementById('track');
            let index = 0;
            setInterval(() => {
                index = (index + 1) % itemCount;
                track.style.transform = `translateX(-${index * 100}%)`;
            }, 3500);
        }

        // Initialize
        fetchProducts();

        // UI Loader Animation
        window.addEventListener('load', () => {
            const lines = document.querySelectorAll('.term-line');
            lines.forEach((l, i) => setTimeout(() => l.style.opacity = 1, i * 400));
            setTimeout(() => {
                document.getElementById('loader').style.transform = "translateY(-100%)";
            }, 2200);
        });
    </script>
</body>
</html>
